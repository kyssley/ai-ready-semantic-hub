name: Bug report / 问题反馈
description: Report a reproducible defect without private data.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 复现步骤
      description: Include version, Python/OS and a synthetic catalog/query.
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
